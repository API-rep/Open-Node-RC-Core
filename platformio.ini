; ============================================================================
; ComBus builder - PlatformIO hook (extra_scripts of [env] below).
; --------------------------------------------------------------------------
; A pre: script: it registers a deferred SCons command that runs BEFORE the
; .cpp compilation, once the build flags are complete. It generates the
; three views, the MD5 headers and the link tables into
; PROJECT_BUILD_DIR/<env>/combus_generated (one directory per environment)
; and adds that directory to CPPPATH.
; To disable temporarily: set COMBUS_BUILDER_SKIP=1 in the environment, or
; comment out the extra_scripts line below.
; See scripts/combus_builder/README.md §9 for the rationale.
; ============================================================================
; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html


[platformio]
; Use machine environment as default.
default_envs = machines
build_dir = ${sysenv.LOCALAPPDATA}/Temp/PlatformIO/build/Open_Node_RC_Core




; ### GLOBAL CONFIGURATION ###
[env]
; ComBus SCons hook: see scripts/combus_scons_hook.py (extra_scripts below).
platform = espressif32@6.7.0
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_encoding = utf-8
monitor_filters = direct
lib_deps = https://github.com/API-rep/PS4_Controller_Host.git#b58a05d  ; fork with BT init fix (IDF 4.4 FreeRTOS deadlock)

           https://github.com/API-rep/common_defs.git#main
           https://github.com/API-rep/PwmBroker.git#main
           https://github.com/API-rep/DcMotorCore.git#main
           https://github.com/API-rep/ServoCore.git#main
board_build.partitions = huge_app.csv
build_src_filter = -<*> +<core/**>  ; exclude all and add "core" directory
build_unflags = -std=gnu++11
extra_scripts =
    pre:scripts/combus_scons_hook.py
build_flags =
    -std=gnu++17
    -I src                            ; add "src" directory to include path (ex: #inclide <machines/config.h>)
    -I include                        ; add "include" directory to include path (done by default, just fo security)
    -D DEBUG_MONITOR_BAUD=${env.monitor_speed} ; debug serial baudrate from monitor configuration
    ; --- Core debug themes (new architecture) ---
    ; -D DEBUG_ALL                    ; enable all shared themes
    ; -D DEBUG_INPUT                  ; absorbed by dashboard Layer 3 (dashboard_input)
    -D DEBUG_HW                       ; hw init sequence log (DRV, BAT) — dashboard_drv covers runtime
    -D DEBUG_SYSTEM                   ; enable shared system debug path
    ; -D DEBUG_COMBUS                 ; absorbed by dashboard Layer 3 (dashboard_input)
    ; -D DEBUG_OUTPUT                 ; output transport trace (UART TX frame seq, len, flags)
    ; --- Debug verbosity level (NOTE: not yet wired in debug.h — future integration) ---
    ; -D DEBUG_LEVEL=0                ; 0 = errors only
    ; -D DEBUG_LEVEL=1                ; 1 = errors + warnings
    ; -D DEBUG_LEVEL=2                ; 2 = errors + warnings + info
    ; -D DEBUG_LEVEL=3                ; 3 = full verbose (all + debug traces)

; ### MACHINES BASE CONFIGURATION ###
[env:machines]
build_src_filter = ${env.build_src_filter} +<machines/> -<core/system/light/neopixel/**>
build_flags = 
    ${env.build_flags}
    ; No category here: each machine identity declares IS_MACHINE, and the side
    ; of each of its couplers (HAS_COUPLER_SOCKET_<NAME>, HAS_COUPLER_PLUG_<NAME>),
    ; checked by the ComBus hook.
    ; --- Failsafe compile-time activation (see src/core/system/failsafe/) ---
    -D HAS_FAILSAFE                ; enables Failsafe umbrella in common ComBus aggregators
                                    ;     (FAILSAFE channel ID + channel init). Mandatory for
                                    ;     any FAILSAFE_X contributor (e.g. HAS_VBAT_FAILSAFE).
    ; --- Failsafe contributors (HAS_<CONTRIBUTOR>_FAILSAFE: VBAT, BOARD_LINK, NODE_LINK, LOCAL_REMOTE) are set per-env. ---
    -I src/machines                ; "root" #includes to src/machines directory

; Machine identity of the Volvo A60H, declared once: referenced as
; ${volvo_A60H_id.build_flags} by volvo_A60H_bruder and the test_node envs.
[volvo_A60H_id]
build_flags =
    -D IS_MACHINE                  ; category of the node: a machine (driven), no coupler yet
    -D MACHINE_VOLVO_A60_H_BRUDER
    -D MACHINE_TYPE_DUMPER_TRUCK   ; machine class: read by the ComBus builder (.cb type filter) and by machine_type.h

; ### VOLVO A60H CONFIGURATION  ###
[env:volvo_A60H_bruder]
extends = env:machines             ; get the parent configuration
build_flags = 
    ${env:machines.build_flags}    ; inherit parent build flags
    -D IS_MAINBOARD                ; env-type flag: selects config/machines/<machine>/board/mainboard/ envCfg tree
    -D BOARD_ESP32_8M_6S           ; machine main board
    -D BOARD_DC_DRIVER_DRV8801     ; board DC driver backend
    ;-D BOARD_DC_DRIVER_DRV8874     ; board DC driver backend
    ${volvo_A60H_id.build_flags}   ; machine identity: category, machine, machine type
    ; --- Input backend selection (see src/core/config/inputs/) ---
    ; Select one backend only.
    ; Use INPUT_NONE for autonomous/headless systems.
    -D INPUT_PS4_DS4_BT            ; Use PS4 DualShock Bluetooth input backend.
    -D PS4_BLUETOOTH_ADDRESS='"28:3a:4d:14:e6:e7"' ; define here your PS4 controller bluetooth address
    ; --- Battery sensing backend (see src/core/config/vbat/) ---
    ;-D VBAT_NONE                   ; no vbat sensing.
    -D VBAT_LIPO                   ; enable battery sensing LiPo profile (bat_lipo.h)
    ; --- Failsafe contributors (see src/core/system/failsafe/, src/core/system/vbat/) ---
    -D HAS_FAILSAFE                ; activate FAILSAFE aggregator + contributors
    -D HAS_VBAT_FAILSAFE           ; activate VBAT-as-Failsafe-contributor (requires HAS_FAILSAFE)
    -D HAS_BOARD_LINK_FAILSAFE     ; contributor BOARD_LINK_FAIL: loss of a link between boards (hard chain)
    -D HAS_NODE_LINK_FAILSAFE      ; contributor NODE_LINK_FAIL: loss of a link to another node (soft chain)
    -D HAS_LOCAL_REMOTE_FAILSAFE   ; contributor LOCAL_REMOTE_FAIL: loss of the local remote, PS4 (soft chain)
    -D HAS_RUNLEVEL_MANAGER        ; this board owns the RUNLEVEL channel (mainboard by convention)
    -D HAS_IGNIT_KEY               ; this machine has a physical ignition key (KEY_BTN → KEY_ACTIVE chain)
    -D HAS_INPUT_PROC              ; this board runs the input chains (buttons -> KEY_ACTIVE, DIRECT_DRIVE, CRUISE_ACTIVE, runlevel)
    -D HAS_SIM_PROC                ; this board runs the simulation chains (ESC_RPM_BUS, ESC_SPEED_BUS, DRIVE_STATE_BUS)
    ; --- Post-init pause (wait for ENTER or remote TRIANGLE before entering loop) ---
    -D PAUSE_LOG_AFTER_INIT
    ; --- ANSI terminal dashboard (200ms refresh, views: 0 overview 1 inputs 2 drivers 3 battery 4 combus C config) ---
    -D DEBUG_DASHBOARD
    ; --- Motion control pipeline (ramp + traction inertia) ---
    -D MOTION_ENABLED
    ; --- Diagnostic patch: keep all DC drivers in sleep (uncomment to isolate the motor current) ---
    ; -D PATCH_MOTORS_FORCE_SLEEP

; ### REMOTES BASE CONFIGURATION ###
[env:remotes]
; Only what a remote uses from the core (the ComBus protocol and its access,
; the hardware, the logs); failsafe, battery and runlevel are machine features.
; See src/remotes/README.md.
build_src_filter = -<*> +<remotes/> +<core/system/combus/protocol/**> +<core/system/combus/combus_access.cpp> +<core/system/hw/pin_reg.cpp> +<core/system/hw/transport/**> +<core/system/debug/logging/**>
build_flags = 
    ${env.build_flags}
    -D IS_REMOTE                   ; category of the node: a remote (it drives)
    -D MACHINE_TYPE_DUMPER_TRUCK   ; the machine type it drives: its ComBus is the BASE view of that type, mirrored
    -D INPUT_NONE                  ; TODO(chantier 4): no physical input yet
    -D REMOTE=MY_REMOTE            ; define the remote controller model
    -I src/remotes                 ; "root" #includes to src/remotes directory


; =============================================================================
; ### TEST ENVIRONMENTS
; =============================================================================

[env:test_combus_loopback]
; ComBus codec round-trip (Group A) + UART loopback (Group B, requires TX↔RX jumper on Serial2).
; Run with: pio test -e test_combus_loopback
test_framework   = unity
test_filter      = test_combus_loopback
test_build_src   = yes                         ; include project src files (combus/uart_com)
; Add the generated combus_generated/combus.cpp to the test env's source
; list so the tests can reference AnalogComBusArray / DigitalComBusArray
; (e.g. the runtime identity tests, Group C). The combus_scons_hook
; (registered globally via [env]) generates the file; this script only
; adds it as a build source. See scripts/combus_test_add_generated_source.py.
extra_scripts =
    pre:scripts/combus_scons_hook.py
    pre:scripts/combus_test_add_generated_source.py
build_src_filter = -<*> +<core/system/combus/protocol/frame/**> +<core/system/combus/protocol/**> +<core/system/combus/combus_access.cpp> +<core/system/com/com_manager.cpp> +<core/system/hw/**/*.cpp> +<core/system/hw/**/*.h>
; hw/ uses the PlatformIO-documented recursive syntax <folder/**/*.ext>.
; The bare <folder/**> syntax (without an extension after **) is NOT
; recursive — it only matches files directly under <folder/>. This single
; pattern captures both pin_reg.cpp (root of hw/) and transport/uart_com.cpp
; (subdir), and any future file added in a hw/ subdirectory.

build_flags =
    ${env.build_flags}
    -D DEBUG_SYSTEM                ; enable sys_log_info (uart_com_init log)
    -D IS_MACHINE                  ; category of the node: a machine, no coupler (checked by the ComBus hook)
    -D MACHINE_VOLVO_A60_H_BRUDER   ; MACHINE build flag used by the test fixtures
    -D MACHINE_TYPE_DUMPER_TRUCK    ; machine class of that machine (no longer defined by its header)
    -D HAS_FAILSAFE                ; required by src/core/system/failsafe/failsafe_hard.cb (channel 'requires' check)
    -D HAS_VBAT_FAILSAFE           ; required by src/core/system/vbat/vbat_fail.cb
    -D HAS_BOARD_LINK_FAILSAFE     ; generates BOARD_LINK_FAIL, written by com_rx_update() (Group M)
    -D HAS_RUNLEVEL_MANAGER        ; required by src/core/system/combus/runlevel.cb (test env simulates owner board)
    -D HAS_NODE_LINK_FAILSAFE      ; generates NODE_LINK_FAIL, written by com_rx_update() (Group M)
    -D VBAT_LIPO                    ; required by include/struct/vbat_struct.h
    -I src
    -I include

[env:test_peer_link]
; Link between two nodes through the generated tables.
; The board is a fictitious TEST tractor (core/config/machines/test_tractor/)
; carrying the TEST coupler (core/config/couplers/test_coupler/):
; combus_peer_links.h holds the table of that link.  Same TX<->RX jumper as
; test_combus_loopback (GPIO17 <-> 16).
; Run with: pio test -e test_peer_link
test_framework   = unity
test_filter      = test_peer_link
test_build_src   = yes
extra_scripts =
    pre:scripts/combus_scons_hook.py
    pre:scripts/combus_test_add_generated_source.py
build_src_filter = -<*> +<core/system/combus/protocol/frame/**> +<core/system/combus/protocol/**> +<core/system/combus/combus_access.cpp> +<core/system/com/com_manager.cpp> +<core/system/hw/**/*.cpp> +<core/system/hw/**/*.h> +<core/config/couplers/**/*.cpp> +<core/system/combus/processors/proc_chain.cpp> +<core/system/combus/processors/input/cb_btn.cpp> +<core/system/combus/processors/logic/cb_delay.cpp>
build_flags =
    ${env.build_flags}
    -D DEBUG_SYSTEM                ; enable sys_log_info
    -D IS_MACHINE                  ; category of the node: the tractor is a machine
    -D MACHINE_TYPE_TEST_TRACTOR   ; fictitious tractor type of the link tests
    -D HAS_COUPLER_SOCKET_TEST_COUPLER   ; the socket of the TEST coupler: it carries
    -D HAS_TEST_COUPLER_ENGAGED_SW   ; the optional guard of the TEST coupler
    -D HAS_COUPLER_SOCKET_TEST_TOOL      ; the socket of the TEST passive coupler, a tool coupled by hand
    -D HAS_FAILSAFE                ; FAILSAFE_HARD, read by the RX path
    -D HAS_BOARD_LINK_FAILSAFE     ; BOARD_LINK_FAIL, written by com_rx_update()
    -D HAS_RUNLEVEL_MANAGER        ; RUNLEVEL, read by the TX debug log
    -D VBAT_LIPO
    -I src
    -I include

[env:test_remote_link]
; A remote driving a dumper truck, its link to the machine (own table and
; MD5) on the TX<->RX jumper (GPIO17 <-> 16).
; Run with: pio test -e test_remote_link
test_framework   = unity
test_filter      = test_remote_link
test_build_src   = yes
extra_scripts =
    pre:scripts/combus_scons_hook.py
    pre:scripts/combus_test_add_generated_source.py
build_src_filter = -<*> +<remotes/com/**> +<core/system/combus/protocol/**> +<core/system/combus/combus_access.cpp> +<core/system/hw/pin_reg.cpp> +<core/system/hw/transport/**> +<core/system/debug/logging/**>
build_flags =
    ${env.build_flags}
    -D DEBUG_SYSTEM                ; enable sys_log_info
    -D IS_REMOTE                   ; category of the node: a remote (it drives)
    -D MACHINE_TYPE_DUMPER_TRUCK   ; the machine type it drives
    -D INPUT_NONE                  ; TODO(chantier 4): no physical input yet
    -I src
    -I include

[env:test_runlevel]
; Runlevel chain of the Volvo (kRunlevelProcs, the real one) run through the
; real chain runner: HALT held until a reboot.
; No jumper needed.  Run with: pio test -e test_runlevel
test_framework   = unity
test_filter      = test_runlevel
test_build_src   = yes
extra_scripts =
    pre:scripts/combus_scons_hook.py
    pre:scripts/combus_test_add_generated_source.py
build_src_filter = -<*> +<core/system/combus/processors/proc_chain.cpp> +<core/system/combus/processors/base/cb_runlevel.cpp> +<core/system/combus/combus_access.cpp>
build_flags =
    ${env.build_flags}
    -D IS_MACHINE                  ; category of the node: a machine, no coupler
    -D MACHINE_VOLVO_A60_H_BRUDER   ; the machine whose runlevel chain is tested
    -D MACHINE_TYPE_DUMPER_TRUCK    ; machine class of that machine
    -D HAS_FAILSAFE                ; FAILSAFE_HARD, FAILSAFE_SOFT and the soft step of the chain
    -D HAS_RUNLEVEL_MANAGER        ; RUNLEVEL
    -D HAS_INPUT_PROC              ; KEY_ACTIVE (with HAS_IGNIT_KEY)
    -D HAS_IGNIT_KEY               ; KEY_ACTIVE and the key step of the chain
    -D VBAT_LIPO
    -I src
    -I include


; =============================================================================
; ### NODE-MODE TEST ENVS (ComBus Builder multi-board check)
; Kept to debug node-mode builds. Each env has its own combus_generated
; (build_dir/<env>/combus_generated). Do NOT override PLATFORMIO_BUILD_DIR with a path of
; this project: the accent in the path breaks the link step (ld .map file).
;   pio run -e test_node_mainboard     (test_node alone is refused on purpose)
; =============================================================================

[env:test_node]
; Node root env ("mother" in the builder): shared flags only, never built alone.
extends = env:machines
build_flags =
    ${env:machines.build_flags}
    ${volvo_A60H_id.build_flags}

[env:test_node_mainboard]
; Main board of the test node: same configuration as volvo_A60H_bruder.
extends = env:test_node
build_flags =
    ${env:test_node.build_flags}
    -D IS_MAINBOARD
    -D BOARD_ESP32_8M_6S
    -D BOARD_DC_DRIVER_DRV8801
    -D INPUT_PS4_DS4_BT
    -D PS4_BLUETOOTH_ADDRESS='"28:3a:4d:14:e6:e7"'
    -D VBAT_LIPO
    -D HAS_VBAT_FAILSAFE
    -D HAS_BOARD_LINK_FAILSAFE
    -D HAS_NODE_LINK_FAILSAFE
    -D HAS_LOCAL_REMOTE_FAILSAFE
    -D HAS_RUNLEVEL_MANAGER
    -D HAS_IGNIT_KEY
    -D HAS_INPUT_PROC
    -D HAS_SIM_PROC
    -D MOTION_ENABLED

[env:test_node_extboard]
; Second board: only resolved statically by the hook (never compiled here).
extends = env:test_node
build_flags =
    ${env:test_node.build_flags}
    -D IS_EXT_BOARD
    -D BOARD_ESP32_8M_6S
    -D HAS_BOARD_LINK_FAILSAFE     ; contributor BOARD_LINK_FAIL: loss of the link to the main board (hard chain)
